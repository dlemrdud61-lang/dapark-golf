<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 | 다파크골프 해운대</title>
<meta name="robots" content="noindex">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="member.css">
</head>
<body>

<header class="header solid" id="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="currentColor"/><path d="M13 30V10l13 5-11 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><circle cx="27" cy="27" r="3" fill="#fff"/></svg>
      <span><b>DA PARK</b> GOLF</span>
    </a>
    <nav class="nav" id="nav">
      <a href="index.html#course">코스소개</a>
      <a href="index.html#guide">이용안내</a>
      <a href="booking.html">실시간 예약</a>
      <a href="index.html#location">오시는 길</a>
      <div class="nav-auth-m" id="authNavM"></div>
    </nav>
    <div class="header-cta">
      <div class="auth-nav" id="authNav"></div>
      <a href="booking.html" class="btn btn-primary btn-sm">실시간 예약</a>
      <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">
    <div class="page-head">
      <p class="eyebrow">ADMIN</p>
      <h1>관리자 · 전체 결제내역</h1>
      <p><span class="live" id="liveLabel">불러오는 중…</span></p>
    </div>

    <section class="card denied" id="denied" hidden>
      <div class="result-icon">🔒</div>
      <h2 style="justify-content:center">관리자만 볼 수 있는 페이지예요</h2>
      <p class="muted">관리자 계정으로 로그인해 주세요.</p>
      <button type="button" class="btn btn-primary" id="adminLoginBtn">관리자 계정으로 로그인</button>
    </section>

    <div id="adminArea" hidden>
      <div class="stats">
        <div class="stat"><span>총 결제 금액</span><strong id="stTotal">-</strong></div>
        <div class="stat"><span>결제 완료 건수</span><strong id="stCount">-</strong></div>
        <div class="stat"><span>오늘 결제 금액</span><strong id="stToday">-</strong></div>
        <div class="stat"><span>오늘 라운딩 팀</span><strong id="stTeams">-</strong></div>
      </div>
      <section class="card">
        <div class="toolbar">
          <input type="search" id="q" placeholder="이름 · 이메일 · 전화 · 예약번호 검색">
          <select id="fStatus" aria-label="결제 상태">
            <option value="paid">결제 완료만</option>
            <option value="">전체 상태</option>
            <option value="pending">결제 대기</option>
            <option value="failed">결제 실패</option>
          </select>
          <input type="date" id="fDate" aria-label="라운딩 날짜">
          <button type="button" class="btn btn-line btn-sm" id="resetBtn">필터 초기화</button>
        </div>
        <p class="small muted" id="countLabel" style="margin-bottom:8px"></p>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>결제 일시</th><th>예약자</th><th>라운딩</th><th>요금 · 인원</th><th>결제수단</th><th>상태</th><th class="num">금액</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p class="copy">© 2026 DA PARK GOLF HAEUNDAE. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
